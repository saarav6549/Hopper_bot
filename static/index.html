<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #0a0a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── YouTube video background ─────────────────────────────── */
    .yt-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000;
    }

    /* Scale the iframe to always cover the viewport (like background-size: cover) */
    .yt-bg iframe {
      position: absolute;
      top: 50%; left: 50%;
      /* 16:9 — ensure minimum coverage */
      width: 100vw;
      height: 56.25vw;   /* 100vw × (9/16) */
      min-height: 100vh;
      min-width: 177.78vh; /* 100vh × (16/9) */
      transform: translate(-50%, -50%);
      pointer-events: none;
      border: none;
    }

    /* ── Chat window (Roblox bottom-left panel) ───────────────── */
    .chat-window {
      position: relative; z-index: 10;
      width: 420px;
      max-width: 95vw;
      display: flex;
      flex-direction: column;
      background: rgba(10, 14, 30, 0.88);
      border: 2px solid rgba(0, 162, 255, 0.35);
      border-radius: 6px;
      box-shadow:
        0 0 0 1px rgba(0,162,255,0.1),
        0 8px 40px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.05);
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────────────────────── */
    .chat-header {
      background: linear-gradient(90deg, #0055d4 0%, #003fa3 100%);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(0,162,255,0.4);
      user-select: none;
    }

    .roblox-logo {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .roblox-logo span { color: #ff3333; }

    .header-title {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header-dot {
      margin-left: auto;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #00e676;
      box-shadow: 0 0 6px #00e676;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── Message list ─────────────────────────────────────────── */
    .messages {
      flex: 1;
      height: 380px;
      overflow-y: auto;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: rgba(0,162,255,0.3); border-radius: 2px; }

    /* ── Individual message ───────────────────────────────────── */
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user  { align-self: flex-end; align-items: flex-end; }
    .msg-row.amit  { align-self: flex-start; align-items: flex-start; }
    .msg-row.system { align-self: center; align-items: center; }

    .msg-name {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 3px;
      opacity: 0.85;
    }

    .msg-row.user  .msg-name { color: #ffb347; }
    .msg-row.amit  .msg-name { color: #00b4ff; }

    .msg-bubble {
      padding: 7px 11px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg-row.user .msg-bubble {
      background: rgba(255, 179, 71, 0.18);
      border: 1px solid rgba(255, 179, 71, 0.35);
      color: #ffe9c4;
      border-radius: 4px 4px 0 4px;
    }

    .msg-row.amit .msg-bubble {
      background: rgba(0, 162, 255, 0.15);
      border: 1px solid rgba(0, 162, 255, 0.35);
      color: #d0eeff;
      border-radius: 4px 4px 4px 0;
    }

    .msg-row.system .msg-bubble {
      background: rgba(255, 50, 50, 0.12);
      border: 1px solid rgba(255, 50, 50, 0.3);
      color: #ff9999;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      border-radius: 4px;
    }

    .msg-time {
      font-size: 9px;
      color: rgba(255,255,255,0.3);
      margin-top: 2px;
      font-weight: 600;
    }

    /* ── Typing indicator ─────────────────────────────────────── */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      align-items: flex-start;
      flex-direction: column;
      gap: 3px;
    }

    .typing-indicator.visible { display: flex; }

    .typing-name {
      font-size: 10px;
      font-weight: 700;
      color: #00b4ff;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0.85;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 8px 12px;
      background: rgba(0, 162, 255, 0.12);
      border: 1px solid rgba(0, 162, 255, 0.3);
      border-radius: 4px 4px 4px 0;
    }

    .typing-dots span {
      width: 5px; height: 5px;
      background: #00b4ff;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%            { transform: translateY(-5px); opacity: 1; }
    }

    /* ── Alert banner ─────────────────────────────────────────── */
    .alert-banner {
      display: none;
      background: rgba(255, 30, 30, 0.2);
      border-top: 1px solid rgba(255, 30, 30, 0.4);
      border-bottom: 1px solid rgba(255, 30, 30, 0.4);
      color: #ff7070;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      padding: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
      animation: fadeUp 0.3s ease;
    }

    .alert-banner.visible { display: block; }

    /* ── Username bar ─────────────────────────────────────────── */
    .username-bar {
      background: rgba(0, 0, 0, 0.4);
      border-top: 1px solid rgba(0,162,255,0.15);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      font-weight: 700;
    }

    .username-bar input {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 3px;
      color: #ffb347;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 12px;
      padding: 3px 7px;
      width: 120px;
      outline: none;
    }

    .username-bar input:focus { border-color: rgba(255,179,71,0.5); }

    /* ── Input area ───────────────────────────────────────────── */
    .input-area {
      display: flex;
      border-top: 1px solid rgba(0,162,255,0.2);
      background: rgba(0,0,0,0.5);
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 10px 12px;
      color: #e0e0e0;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 600;
      caret-color: #00b4ff;
    }

    .chat-input::placeholder { color: rgba(255,255,255,0.25); }

    .send-btn {
      background: linear-gradient(135deg, #0055d4, #003fa3);
      border: none;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 12px;
      padding: 0 16px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background 0.15s;
      border-left: 1px solid rgba(0,162,255,0.2);
    }

    .send-btn:hover  { background: linear-gradient(135deg, #0066ff, #0050c8); }
    .send-btn:active { background: #002f80; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="yt-bg">
  <iframe
    src="https://www.youtube.com/embed/HYGTBrIMhlI?autoplay=1&mute=1&loop=1&playlist=HYGTBrIMhlI&controls=0&showinfo=0&rel=0&iv_load_policy=3&disablekb=1&modestbranding=1"
    allow="autoplay; encrypted-media"
    allowfullscreen
  ></iframe>
</div>

<div class="chat-window">

  <!-- Header -->
  <div class="chat-header">
    <div class="roblox-logo">R<span>O</span>BLOX</div>
    <div class="header-title">Chat</div>
    <div class="header-dot"></div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="msg-row system">
      <div class="msg-bubble">Welcome to Roblox! You joined the game.</div>
    </div>
  </div>

  <!-- Typing indicator -->
  <div class="typing-indicator" id="typing">
    <div class="typing-name">Amit_Rblx</div>
    <div class="typing-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Alert banner (platform switch) -->
  <div class="alert-banner" id="alert-banner">
    ⚠ Platform-switch attempt detected
  </div>

  <!-- Username bar -->
  <div class="username-bar">
    Your name:
    <input type="text" id="username-input" value="Player1234" maxlength="20" />
  </div>

  <!-- Input -->
  <div class="input-area">
    <input
      class="chat-input"
      id="chat-input"
      type="text"
      placeholder="Say something..."
      maxlength="500"
      autocomplete="off"
    />
    <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
  </div>

</div>

<script>
  // ── Session ────────────────────────────────────────────────────
  const SESSION_ID = 'session_' + Math.random().toString(36).slice(2, 10);
  const API_BASE   = '';          // same origin

  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // ── Scroll to bottom ───────────────────────────────────────────
  function scrollBottom() {
    const m = document.getElementById('messages');
    m.scrollTop = m.scrollHeight;
  }

  // ── Append a message bubble ────────────────────────────────────
  function appendMessage(role, name, text) {
    const messages = document.getElementById('messages');

    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    if (role !== 'system') {
      const nameEl = document.createElement('div');
      nameEl.className = 'msg-name';
      nameEl.textContent = name;
      row.appendChild(nameEl);
    }

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    row.appendChild(bubble);

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = now();
    row.appendChild(time);

    messages.appendChild(row);
    scrollBottom();
  }

  // ── Send message ───────────────────────────────────────────────
  async function sendMessage() {
    const input   = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const typing  = document.getElementById('typing');
    const username = document.getElementById('username-input').value.trim() || 'Player1234';
    const text    = input.value.trim();

    if (!text) return;

    // Show user message
    appendMessage('user', username, text);
    input.value = '';
    sendBtn.disabled = true;

    // Show typing indicator
    typing.classList.add('visible');
    scrollBottom();

    try {
      const res = await fetch(`${API_BASE}/message`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: SESSION_ID,
          platform: 'Roblox',
          message: text,
        }),
      });

      const data = await res.json();

      // Show platform-switch alert banner
      if (data.platform_switch_detected) {
        document.getElementById('alert-banner').classList.add('visible');
      }

      appendMessage('amit', 'Amit_Rblx', data.reply);

    } catch (err) {
      appendMessage('system', '', 'Connection error. Try again.');
    } finally {
      typing.classList.remove('visible');
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // ── Enter key to send ──────────────────────────────────────────
  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
</body>
</html>
